<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../../dist/output.css" />
    <title>Login | Track Power</title>
    <script src="../../src/js/english-components.js" defer></script>
    <script src="../../src/js/categories.js" defer></script>
    <script src="../../src/js/cart-state.js" defer></script>
    <script src="../../src/js/storefront.js" defer></script>
    <script src="../../src/js/header.js" defer></script>
    <script src="../../src/js/homepage-footer.js" defer></script>
  </head>

  <body class="bg-surface-bg">
    <div data-english-header></div>
    <main>
      <a class="flex items-center gap-2 px-5 pt-6" href="../index.html">
        <img src="../../assets/icons/arrow-right-02-round.svg" alt="" class="rotate-180" />
        <span class="text-sm md:text-base">Back to Home</span>
      </a>

      <div class="flex h-dvh items-center justify-center gap-2 overflow-hidden px-5">
        <div class="flex w-full flex-col items-start rounded-[20px] bg-white p-6 md:w-md md:p-10">
          <span class="pb-2 text-lg font-semibold text-black md:pb-3 md:text-2xl">
            Log In to Your Account
          </span>

          <p class="text-muted text-sm leading-6 md:text-base">
            Enter your mobile number to receive a verification code via SMS.
          </p>

          <label class="sr-only" for="login-name"> Full Name </label>

          <input
            class="focus:border-brand-700 mt-10 h-12.5 w-full rounded-xl border border-[#1916161F] bg-white p-5 text-left text-base text-[#19161699] transition outline-none placeholder:text-[#19161699] md:h-15"
            type="text"
            name="name"
            id="login-name"
            placeholder="Full Name"
          />

          <button
            type="submit"
            class="bg-brand-700 hover:bg-brand-800 focus-visible:ring-brand-700 mt-4 items-start rounded-xl px-8 py-4 text-sm text-white transition focus-visible:ring-2 focus-visible:ring-offset-2 md:mt-5 md:text-base"
          >
            Log In
          </button>
        </div>

        <div class="flex w-full flex-col items-start rounded-[20px] bg-white p-6 md:w-md md:p-10">
          <span class="pb-2 text-lg font-semibold text-black md:pb-3 md:text-2xl">
            Verify Your Mobile Number
          </span>

          <p class="text-muted text-sm leading-6 md:text-base">
            Enter the 5-digit code sent to
            <strong class="text-primary">09123456789</strong>.
          </p>

          <label class="sr-only" for="login-code"> Verification Code </label>

          <input
            class="focus:border-brand-700 mt-10 h-12.5 w-full rounded-xl border border-[#1916161F] bg-white p-5 text-left text-base text-[#19161699] transition outline-none placeholder:text-[#19161699] md:h-15"
            type="text"
            name="name"
            id="login-code"
            placeholder="Verification Code"
          />

          <p class="text-muted mt-4 text-sm leading-6 md:mt-5 md:text-base">
            Resend code in
            <strong class="text-primary">01:20</strong>
          </p>

          <button
            type="submit"
            class="bg-brand-700 hover:bg-brand-800 focus-visible:ring-brand-700 mt-4 items-start rounded-xl px-8 py-4 text-sm text-white transition focus-visible:ring-2 focus-visible:ring-offset-2 md:mt-5 md:text-base"
          >
            Log In
          </button>
        </div>
      </div>
    </main>

    <!-- swiper config js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../../src/js/swiper-config.js"></script>
    <div data-english-footer></div>
  </body>
</html>
