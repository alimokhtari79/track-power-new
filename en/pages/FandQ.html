<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../../dist/output.css" />
    <title>FAQ | Trak Power</title>
    <script src="../../src/js/english-components.js" defer></script>
    <script src="../../src/js/categories.js" defer></script>
    <script src="../../src/js/cart-state.js" defer></script>
    <script src="../../src/js/storefront.js" defer></script>
    <script src="../../src/js/header.js" defer></script>
    <script src="../../src/js/homepage-footer.js" defer></script>
  </head>
  <body class="bg-surface-bg">
    <div data-english-header></div>
    <main>
      <nav
        aria-label="Trak Power "
        class="container-custom text-muted mb-10 flex items-center gap-1 pt-5 text-xs sm:mb-15 md:mb-15 md:text-sm"
      >
        <a href="../../index.html" class="hover:text-primary transition">Home</a>
        <svg
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M11.25 4.5C11.25 4.5 6.75001 7.8142 6.75 9.00004C6.74999 10.1859 11.25 13.5 11.25 13.5"
            stroke="#666464"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="text-primary">FAQ</span>
      </nav>
      <!-- main container -->
      <section
        class="container-custom mb-20 flex flex-col justify-between gap-10 md:mb-30 md:flex-row"
      >
        <div
          class="flex flex-col items-center justify-center gap-4 md:w-107 md:items-start md:gap-5 md:text-start"
        >
          <h2 class="text-2xl leading-tight md:text-4xl">
            <span class="font-extrabold"> Trak Power </span><br />
            <span class="font-medium"> Trak Power </span>
          </h2>
          <p class="text-muted w-full max-w-200 text-center md:text-start">
            Trak Power About Trak Power PartsTrak Power . Trak Power .
          </p>
        </div>
        <!-- Q&A section -->
        <div class="shrink-0">
          <div class="flex w-full flex-col gap-3 md:w-193">
            <!-- Q&A item -->
            <details
              class="group rounded-2xl border border-[#DFDFDF] transition-all duration-300 ease-in-out open:border-0 open:bg-white"
            >
              <summary class="flex cursor-pointer list-none items-center justify-between gap-4 p-5">
                <span class="text-primary text-[15px] font-semibold md:text-lg">
                  How can I place an order?
                </span>

                <span
                  class="flex size-6 shrink-0 items-center justify-center transition-transform duration-300 group-open:rotate-180"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 20 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M15 7.50004C15 7.50004 11.3176 12.5 9.99996 12.5C8.68237 12.5 5 7.5 5 7.5"
                      stroke="#6E6E6F"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
              </summary>

              <div class="px-5 pb-5">
                <p class="text-sm leading-6 text-[#474647] md:text-base">
                  Trak Power TruckTrak Power Parts Compatible Trak Power .
                </p>
              </div>
            </details>
          </div>
        </div>
      </section>

      <!-- Newsletter Subscription -->
      <section class="container-custom">
        <div
          class="bg-primary flex flex-col items-center justify-between rounded-[20px] p-5 md:flex-row md:p-10"
        >
          <div
            class="flex w-full max-w-137.5 flex-col items-center justify-between gap-3.25 text-center text-white md:flex-row md:gap-[unset] md:text-start"
          >
            <div class="text-2xl md:text-[28px]">
              <span class="font-extrabold">Subscribe to</span><br />
              <span class="font-medium">Email newsletter</span>
            </div>
            <p class="text-sm leading-6.25 md:w-83 md:text-base">
              Trak Power Subscribe to Trak Power Latest ProductsTrak Power RecommendationsTrak Power
              .
            </p>
          </div>
          <div
            class="mt-8 flex h-15 w-full max-w-100.5 rounded-xl border border-[#FFFFFF1F] bg-white py-1 ps-4 pe-1 md:mt-0"
          >
            <input
              id="faq-newsletter-email"
              placeholder="Enter your email..."
              class="text-muted placeholder-muted flex flex-1 text-sm outline-0"
              type="text"
              aria-label="Email Subscribe to Trak Power"
            />
            <button class="bg-brand-700 h-full rounded-lg px-5 text-white" type="submit">
              Subscribe
            </button>
          </div>
        </div>
      </section>
    </main>
    <!-- swiper config js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../../src/js/swiper-config.js"></script>
    <div data-english-footer></div>
  </body>
</html>
